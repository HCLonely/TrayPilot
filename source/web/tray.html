<!doctype html><html lang="zh-CN" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'"><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="tray.css"><title>TrayPilot</title></head><body>
<section class="tray-popup" aria-label="TrayPilot"><header class="popup-head"><span class="logo" id="trayLogo"></span><div><strong>TrayPilot</strong><small id="trayHint"></small></div><button class="rowaction" id="trayOpen"></button></header>
<div class="quick-commands"><button class="btn primary" id="trayRestore"></button><button class="btn" id="trayPause" aria-pressed="false"></button></div>
<label class="popup-filter"><span id="traySearchIcon"></span><input id="traySearch" aria-label="搜索程序"></label><div class="popup-section"><span id="traySection"></span><button class="rowaction" id="trayRefresh"></button></div>
<div class="popup-apps" id="trayApps"></div><div class="pagination"><button id="trayPrevious" aria-label="上一页"></button><span id="trayPageLabel" role="status"></span><button id="trayNext" aria-label="下一页"></button></div>
<div class="popup-options"><span id="trayStartupLabel"></span><button class="switch" id="trayStartup" role="switch" aria-checked="false"></button></div><div class="popup-options"><span id="traySelfLabel"></span><button class="switch" id="traySelf" role="switch" aria-checked="true"></button></div>
<footer class="popup-footer"><button id="traySystem"></button><button id="traySettings"></button><button id="trayAbout"></button><button id="trayExit"></button></footer>
<div id="trayFeedback" class="tray-feedback" role="status" hidden><span id="trayFeedbackText"></span><button class="rowaction" id="trayRetry"></button><button class="rowaction" id="trayUndo"></button></div></section>
<dialog class="dialog" id="trayGroupDialog" aria-labelledby="trayGroupTitle"><header class="dialogheader"><h2 id="trayGroupTitle"></h2><button class="close-btn" id="trayGroupClose" aria-label="关闭">×</button></header><div class="dialogbody"><p id="trayGroupHelp"></p><div id="trayGroupEntries"></div><button class="btn primary" id="trayGroupAll"></button><p class="tray-error" id="trayGroupError" role="alert"></p></div></dialog>
<dialog class="dialog" id="trayExitDialog" aria-labelledby="trayExitTitle"><header class="dialogheader"><h2 id="trayExitTitle"></h2></header><div class="dialogbody"><p id="trayExitHelp"></p><p class="tray-error" id="trayExitError" role="alert"></p></div><footer class="dialogfooter"><button class="btn" id="trayExitCancel"></button><button class="btn danger" id="trayExitConfirm"></button></footer></dialog>
<script src="tray.js"></script></body></html>
