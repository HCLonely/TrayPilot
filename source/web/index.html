<dialog id="prefDiscardDialog" class="dialog pref-dialog" aria-labelledby="prefDiscardTitle"><div class="dialogheader"><div><h2 id="prefDiscardTitle" data-pref-text="discardTitle"></h2><p data-pref-text="discardSubtitle"></p></div><button type="button" class="close-btn" onclick="closePreferencesDialog('prefDiscardDialog')" aria-label="关闭"><i data-icon="close"></i></button></div><div class="dialogbody"><p class="pref-pending-message" data-pref-text="discardHelp"></p><p class="error" id="prefDiscardError" role="alert" tabindex="-1"></p></div><div class="dialogfooter"><button class="btn" id="prefDiscardContinue" onclick="discardSettingsAndContinue()" data-pref-text="discardContinue"></button><button class="btn primary" id="prefStay" onclick="closePreferencesDialog('prefDiscardDialog')" data-pref-text="stay"></button></div></dialog>
