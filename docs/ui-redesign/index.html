<!doctype html>
<html lang="zh-CN" data-theme="light">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TrayPilot · 全部界面设计</title>
<style>
:root{color-scheme:light;--bg:#e9eef7;--ink:#17243b;--muted:#526178;--surface:#ffffffdf;--line:#d6dfec;--blue:#2458d3;--soft:#eaf1ff}[data-theme=dark]{color-scheme:dark;--bg:#101724;--ink:#eaf0fa;--muted:#a6b4ca;--surface:#1c2638ef;--line:#3d4e66;--blue:#9cbbff;--soft:#2b3d5c}*{box-sizing:border-box}body{margin:0;padding:48px;color:var(--ink);font:14px/1.7 'Segoe UI','Microsoft YaHei UI',sans-serif;background:radial-gradient(ellipse at 10% 10%,#668cff22,transparent 50%),var(--bg)}main{max-width:1344px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:34px}.eyebrow{letter-spacing:2px;color:var(--blue);font-size:12px;font-weight:700}h1{font-size:30px;margin:8px 0;font-weight:600}p{color:var(--muted);margin:0}.themes{display:flex;gap:6px}button,a{font:inherit}button{padding:8px 16px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer}button[aria-pressed=true]{background:var(--soft);color:var(--blue)}a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}a:focus-visible,button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.card{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface);box-shadow:0 12px 32px #17243b0b;backdrop-filter:blur(18px)}.preview{display:block;background:var(--bg);aspect-ratio:4/3;overflow:hidden}.preview img{width:100%;height:100%;object-fit:contain;display:block}.body{padding:20px}.number{font-size:11px;letter-spacing:1.5px;color:var(--muted)}h2{font-size:18px;font-weight:600;margin:6px 0 8px}.status{float:right;font-size:11px;color:var(--muted);padding:3px 8px;background:var(--soft);border-radius:20px}.links{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;margin-top:16px}.note{margin-top:26px;border:1px solid var(--line);border-radius:14px;padding:20px;background:var(--surface)}.note p+p{margin-top:8px}.note a{margin-right:20px}@media(max-width:1000px){body{padding:28px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){body{padding:18px}.grid{grid-template-columns:1fr}header{gap:20px;align-items:flex-start}h1{font-size:24px}.themes{flex-direction:column}}
</style>
<main><header><div><div class="eyebrow">TRAYPILOT / DESIGN REVIEW</div><h1>把托盘整理得安静、清楚。</h1><p>五部分设计 · 全部已确认 · 设计已定稿</p></div><div class="themes"><button onclick="theme('light')" id="light">浅色</button><button onclick="theme('dark')" id="dark">深色</button></div></header>
<div class="grid" id="cards"></div>
<div class="note"><p>所有程序使用对应图标；界面支持亮暗主题、键盘焦点、明确的操作反馈与危险操作确认。</p><p>这是离线交互设计原型，使用示例数据。隐藏、保存、退出及结束任务均为模拟操作，各页面的业务状态独立；正式 WinForms 界面正在分部分实施。</p><p><a href="implementation/progress.md">正式界面实施进度与截图</a><a href="design-spec.md">完整设计与开发交接规范</a><a href="phase-05-brief.md">第五部分需求说明</a></p></div></main>
<script>
const entries=[
 ['01','图标管理','搜索、筛选、多选、批量操作与图标详情。','phase-01.html','phase-01','已确认', [['需求说明','phase-01-brief.md']]],
 ['02','自动隐藏规则','管理规则、创建匹配范围与暂时显示例外。','phase-02.html','phase-02','已确认', [['创建规则','phase-02.html?view=create'],['需求说明','phase-02-brief.md']]],
 ['03','系统图标','十二类系统图标、联动提示及兼容性处理。','phase-03.html','phase-03','已确认', [['需求说明','phase-03-brief.md']]],
 ['04','设置与关于','统一保存偏好、外观主题与快捷键校验。','phase-04.html','phase-04-general','已确认', [['外观','phase-04.html?view=appearance'],['快捷键','phase-04.html?view=shortcuts'],['关于','phase-04.html?view=about'],['需求说明','phase-04-brief.md']]],
 ['05','托盘快捷面板','真实图标、按程序分组、分页与快捷操作。','phase-05.html','phase-05-tray','已确认', [['多图标分组','phase-05.html'],['需求说明','phase-05-brief.md']]],
 ['05','首次使用与操作状态','空结果、执行中、部分失败、程序属性和结束任务。','phase-05-states.html?state=welcome','phase-05-welcome','已确认', [['空列表','phase-05-states.html?state=empty'],['无匹配','phase-05-states.html?state=search'],['执行中','phase-05-states.html?state=busy'],['部分失败','phase-05-states.html?state=partial'],['结束任务','phase-05-states.html?state=terminate'],['程序属性','phase-05-states.html?state=properties']]]
];
function link(path,t){const u=new URL(path,location.href);if(path.endsWith('.md'))return u.href;u.searchParams.set('theme',t);return u.href}
function theme(t){t=t==='dark'?'dark':'light';document.documentElement.dataset.theme=t;sessionStorage.setItem('traypilot-design-theme',t);for(const id of ['light','dark'])document.querySelector('#'+id).setAttribute('aria-pressed',id===t);document.querySelector('#cards').innerHTML=entries.map(([n,title,desc,path,shot,status,links])=>`<article class="card"><a class="preview" href="${link(path,t)}" aria-label="打开${title}"><img src="${shot}-${t}.png" alt="${title} ${t==='dark'?'深色':'浅色'}示意图"></a><div class="body"><span class="status">${status}</span><span class="number">PART ${n}</span><h2><a href="${link(path,t)}">${title}</a></h2><p>${desc}</p><div class="links">${links.map(([label,p])=>`<a href="${link(p,t)}">${label}</a>`).join('')}</div></div></article>`).join('')}
theme(new URLSearchParams(location.search).get('theme')||sessionStorage.getItem('traypilot-design-theme'));
</script></html>
