n><button id="undo" onclick="undo()">撤销</button></div>
<script>
const paths={brand:'M4 15l2 5h12l2-5M7 6v5M12 3v8M17 7v4',tray:'M4 5h16v14H4zM4 13h5l1 3h4l1-3h5',rules:'M6 5h14M6 12h14M6 19h14M3 5h.01M3 12h.01M3 19h.01',monitor:'M3 4h18v12H3zM8 21h8M12 16v5',settings:'M4 7h16M4 17h16M8 4v6M16 14v6',info:'M12 8h.01M12 11v6M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0',restore:'M3 5v5h5M3 10a9 9 0 1 1 2 8',search:'M21 21l-5-5M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0',refresh:'M20 7V3l-3 3M20 6a9 9 0 0 0-15 2M4 17v4l3-3M4 18a9 9 0 0 0 15-2',list:'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01',grid:'M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z',eye:'M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0',hidden:'M3 3l18 18M9 5c7-2 13 7 13 7l-3 4M6 6l-4 6s3 7 10 7c2 0 4-1 5-2',minus:'M5 12h14',square:'M5 5h14v14H5z',close:'M5 5l14 14M5 19L19 5',sun:'M12 8a4 4 0 1 1 0 8 4 4 0 0 1 0-8M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1 1M18 18l1 1M5 19l1-1M18 6l1-1',moon:'M20 14A9 9 0 0 1 10 3a9 9 0 1 0 10 11'};
const appIcon=a=>`<span class="appicon"><img src="${a.iconPath}" alt="" width="32" height="32" onerror="this.parentElement.innerHTML=icon('monitor');this.parentElement.title='图标暂不可用'"></span>`;
const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[n]||paths.info}"/></svg>`;
document.querySelectorAll('[data-icon]').forEach(e=>e.innerHTML=icon(e.dataset.icon));document.querySelector('#light').innerHTML=icon('sun')+'浅色';document.querySelector('#dark').innerHTML=icon('moon')+'深色';
const apps=[{id:1,name:'OneDrive',proc:'OneDrive.exe',iconPath:'assets/onedrive.png',hidden:true,rule:'此程序全部图标',path:'C:\\Program Files\\Microsoft OneDrive\\OneDrive.exe'},{id:2,name:'微信',proc:'WeChat.exe',iconPath:'assets/wechat.png',hidden:false,rule:'',path:'C:\\Program Files\\Tencent\\WeChat\\WeChat.exe'},{id:3,name:'Windows 安全中心',proc:'SecurityHealthSystray.exe',iconPath:'assets/windows-security.png',hidden:false,rule:'',path:'C:\\Windows\\System32\\SecurityHealthSystray.exe'},{id:4,name:'Steam',proc:'steam.exe',iconPath:'assets/steam.png',hidden:true,rule:'仅此图标',path:'C:\\Program Files (x86)\\Steam\\steam.exe'},{id:5,name:'腾讯 QQ',proc:'QQ.exe',iconPath:'assets/qq.png',hidden:false,rule:'',path:'C:\\Program Files\\Tencent\\QQ\\QQ.exe'},{id:6,name:'Everything',proc:'Everything.exe',iconPath:'assets/everything.png',hidden:false,rule:'',path:'C:\\Program Files\\Everything\\Everything.exe'},{id:7,name:'NVIDIA App',proc:'nvcontainer.exe',iconPath:'assets/nvidia.png',hidden:true,rule:'此程序全部图标',path:'C:\\Program Files\\NVIDIA Corporation\\nvcontainer.exe'},{id:8,name:'Microsoft Teams',proc:'ms-teams.exe',iconPath:'assets/teams.png',hidden:false,rule:'',path:'C:\\Program Files\\WindowsApps\\MSTeams\\ms-teams.exe'}];
let current=1,mode='all',grid=false,selected=new Set(),previous=null,timer,anchor=1;const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setTheme(t){document.documentElement.dataset.theme=t;sessionStorage.setItem('traypilot-design-theme',t);document.querySelectorAll('.theme button').forEach(b=>{b.classList.toggle('active',b.id===t);b.setAttribute('aria-pressed',b.id===t)});}
function matching(){const q=document.querySelector('#search').value.toLowerCase();return apps.filter(a=>(mode==='all'||a.hidden===(mode==='hidden'))&&(a.name+' '+a.path).toLowerCase().includes(q));}
function filter(m){mode=m;document.querySelectorAll('[data-filter]').forEach(b=>{b.classList.toggle('active',b.dataset.filter===m);b.setAttribute('aria-pressed',b.dataset.filter===m)});render();}
function setView(g){grid=g;document.querySelector('#entries').classList.toggle('grid',g);document.querySelectorAll('.views button').forEach(b=>{const active=(b.id==='gridView')===g;b.classList.toggle('active',active);b.setAttribute('aria-pressed',active)});render();}
function toast(msg,canUndo=false){document.querySelector('#message').textContent=msg;document.querySelector('#undo').hidden=!canUndo;document.querySelector('#toast').classList.add('show');clearTimeout(timer);timer=setTimeout(()=>document.querySelector('#toast').classList.remove('show'),6000);}
function upcoming(name,p){let extra=name.includes('关于')?'&view=about':'';if(name==='规则详情'){const a=apps.find(a=>a.id===current);extra='&app='+a.id+(a.rule?'':'&view=create')}location.href='phase-0'+(p===5?4:p)+'.html?theme='+document.documentElement.dataset.theme+extra;}
function remember(){previous=apps.map(a=>a.hidden);}
function change(id){remember();const a=apps.find(a=>a.id===id);a.hidden=!a.hidden;render();toast(a.hidden?`已隐藏 ${a.name}，软件继续运行`:a.rule?`已暂时显示 ${a.name}，本次运行不再自动隐藏`:`已恢复 ${a.name}`,true);}
function batch(h){remember();apps.filter(a=>selected.has(a.id)).forEach(a=>a.hidden=h);selected.clear();render();toast(h?'已隐藏所选图标，软件继续运行':'已恢复所选图标；规则命中项本次运行暂时显示',true);}
function restoreAll(){remember();apps.forEach(a=>a.hidden=false);render();toast('已恢复本工具隐藏的普通图标；保留规则，本次运行暂时显示',true);}
function undo(){if(previous){apps.forEach((a,i)=>a.hidden=previous[i]);previous=null;render();toast('已撤销上次操作');}}
async function copyPath(){try{await navigator.clipboard.writeText(apps.find(a=>a.id===current).path);toast('完整路径已复制');}catch{toast('浏览器未允许复制，请从详情中选择路径后复制');}}
function render(){const count=apps.filter(a=>a.hidden).length;document.querySelector('#summary').innerHTML=`<span><b>${apps.length}</b>个图标</span><i></i><span><b>${apps.length-count}</b>可见</span><span><b>${count}</b>已隐藏</span><span class="rule-status">${icon('rules')}3 条自动隐藏规则生效中</span>`;const result=matching();document.querySelector('#entries').innerHTML=result.length?result.map(a=>`<div class="entry ${a.id===current?'selected':''}" data-id="${a.id}"><input type="checkbox" aria-label="选择 ${esc(a.name)}" ${selected.has(a.id)?'checked':''}><div class="appname">${appIcon(a)}<div><strong>${a.name}</strong><small>${a.proc}</small></div></div><span class="state ${a.hidden?'':'visible'}">${icon(a.hidden?'hidden':'eye')}${a.hidden?'已隐藏':'可见'}</span><span class="rule">${a.rule||'—'}</span><button class="rowaction" aria-label="${a.hidden?'恢复':'隐藏'} ${esc(a.name)}">${a.hidden?'恢复':'隐藏'}</button></div>`).join(''):'<div class="empty">未找到匹配图标<br>尝试其他名称或清空搜索</div>';
document.querySelectorAll('.entry').forEach(row=>{const id=+row.dataset.id;row.tabIndex=0;row.setAttribute('aria-label',`${apps.find(a=>a.id===id).name}，${apps.find(a=>a.id===id).hidden?'已隐藏':'可见'}，回车查看详情，空格选择`);row.onclick=e=>{if(e.target.closest('input,button'))return;if(e.shiftKey){const start=result.findIndex(a=>a.id===anchor),end=result.findIndex(a=>a.id===id);if(start>=0)result.slice(Math.min(start,end),Math.max(start,end)+1).forEach(a=>selected.add(a.id));}else if(e.ctrlKey){selected.has(id)?selected.delete(id):selected.add(id);anchor=id;}else{anchor=id;}current=id;render();document.querySelector(`.entry[data-id="${id}"]`)?.focus({preventScroll:true});};row.onkeydown=e=>{if(e.target!==row)return;if(e.key==='Enter'||e.key===' '){e.preventDefault();current=id;if(e.key===' ')selected.has(id)?selected.delete(id):selected.add(id);render();document.querySelector(`.entry[data-id="${id}"]`)?.focus({preventScroll:true});}};row.ondblclick=e=>{if(!e.target.closest('input,button'))change(id)};row.querySelector('input').onchange=e=>{e.target.checked?selected.add(id):selected.delete(id);render();document.querySelector(`.entry[data-id="${id}"] input`)?.focus({preventScroll:true})};row.querySelector('button').onclick=()=>change(id)});const all=document.querySelector('#selectAll');all.checked=result.length>0&&result.every(a=>selected.has(a.id));all.indeterminate=result.some(a=>selected.has(a.id))&&!all.checked;
document.querySelector('#tablefoot').innerHTML=selected.size?`<span>已选择 ${selected.size} 项</span><span><button class="rowaction" onclick="batch(true)">隐藏选中</button>　<button class="rowaction" onclick="batch(false)">恢复选中</button></span>`:`<span>${result.length} 个结果</span><span>双击隐藏 / 恢复 · Ctrl / Shift 多选</span>`;
const a=apps.find(a=>a.id===current);document.querySelector('#detail').innerHTML=`<div class="detailhero">${appIcon(a)}<div><h3>${a.name}</h3><p>普通软件托盘图标</p></div></div><span class="pill">${icon(a.hidden?'hidden':'eye')}${a.hidden?'已隐藏 · 软件仍在运行':'可见 · 软件仍在运行'}</span><dl><dt>进程名称</dt><dd>${a.proc}</dd><dt>程序路径</dt><dd class="pathbox"><div class="path">${esc(a.path)}</div><button onclick="copyPath()">复制完整路径</button></dd></dl><div class="rulebox"><strong>${icon('rules')}${a.rule?'自动隐藏已启用':'尚未设置自动隐藏'}</strong><p>${a.rule?`匹配范围：${a.rule}<br>下次运行时继续自动隐藏。`:'手动隐藏仅改变当前显示状态。<br>添加规则可在下次运行时自动隐藏。'}</p><button onclick="upcoming('规则详情',2)">${a.rule?'查看对应规则':'创建隐藏规则'} →</button></div>`;document.querySelector('#detailactions').innerHTML=`<button class="btn primary" onclick="change(${a.id})">${icon(a.hidden?'eye':'hidden')}${a.hidden?'暂时显示图标':'隐藏此图标'}</button><p>${a.hidden&&a.rule?'本次运行暂时显示，原规则保留':'仅改变图标显示，不会关闭软件'}</p>`;
}
document.querySelector('#search').oninput=render;document.querySelector('#selectAll').onchange=e=>{matching().forEach(a=>e.target.checked?selected.add(a.id):selected.delete(a.id));render()};document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key.toLowerCase()==='k'){e.preventDefault();document.querySelector('#search').focus()}if(e.key==='Escape'){document.querySelector('#toast').classList.remove('show')}});
setTheme(new URLSearchParams(location.search).get('theme')||sessionStorage.getItem('traypilot-design-theme')||'light');filter('all');
</script>
</html>
