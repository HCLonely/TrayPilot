name: Build Windows packages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 / ${{ matrix.package }}
    # Keep the native helper on the documented VS 2022 / Windows SDK toolchain.
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: full
            self-contained: 'true'
          - package: lite
            self-contained: 'false'
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Build native taskbar helper
        run: ./source/native/build.ps1

      - name: Publish application
        run: >-
          dotnet publish ./source/TrayPilot.csproj
          --configuration Release
          --runtime win-x64
          --self-contained ${{ matrix.self-contained }}
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          --output ./publish/${{ matrix.package }}

      - name: Verify package contents
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          $publishDir = Join-Path ./publish $env:PACKAGE
          foreach ($required in @('TrayPilot.exe', 'TrayPilot.Xaml.dll')) {
            if (-not (Test-Path (Join-Path $publishDir $required) -PathType Leaf)) {
              throw "Missing package file: $required"
            }
          }
          # Loading and checking exports needs no Explorer or interactive taskbar.
          $helper = [System.Runtime.InteropServices.NativeLibrary]::Load((Resolve-Path (Join-Path $publishDir 'TrayPilot.Xaml.dll')).Path)
          try {
            foreach ($export in @('Attach', 'IdentifyGlyph', 'DllGetClassObject', 'DllCanUnloadNow')) {
              [void][System.Runtime.InteropServices.NativeLibrary]::GetExport($helper, $export)
            }
          } finally {
            [System.Runtime.InteropServices.NativeLibrary]::Free($helper)
          }
          foreach ($language in Get-ChildItem ./source/languages -Filter *.json) {
            $publishedLanguage = Join-Path $publishDir "languages/$($language.Name)"
            if (-not (Test-Path $publishedLanguage -PathType Leaf)) {
              throw "Missing language pack: $($language.Name)"
            }
          }

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: TrayPilot-win-x64-${{ matrix.package }}
          path: publish/${{ matrix.package }}/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Download built packages
        uses: actions/download-artifact@v8
        with:
          pattern: TrayPilot-win-x64-*
          path: packages
          merge-multiple: false

      - name: Create release archives
        run: |
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          foreach ($package in @('full', 'lite')) {
            $name = "TrayPilot-win-x64-$package"
            $packageDir = Join-Path ./packages $name
            foreach ($required in @('TrayPilot.exe', 'TrayPilot.Xaml.dll', 'languages/en-US.json', 'languages/zh-CN.json')) {
              if (-not (Test-Path (Join-Path $packageDir $required) -PathType Leaf)) {
                throw "Missing release file: $name/$required"
              }
            }
            Compress-Archive -Path "$packageDir/*" -DestinationPath "./release-assets/$name.zip" -Force
          }

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = @(Get-ChildItem ./release-assets -Filter *.zip | ForEach-Object { $_.FullName })
          gh release view $env:RELEASE_TAG --repo $env:GH_REPO *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @assets --repo $env:GH_REPO --clobber
          } else {
            $releaseArgs = @(
              'release', 'create', $env:RELEASE_TAG,
              '--repo', $env:GH_REPO,
              '--verify-tag', '--generate-notes',
              '--title', "TrayPilot $env:RELEASE_TAG"
            )
            if ($env:RELEASE_TAG.Contains('-')) {
              $releaseArgs += '--prerelease'
            }
            gh @releaseArgs @assets
          }
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to publish the GitHub Release.'
          }
